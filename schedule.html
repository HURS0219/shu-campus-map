<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>上大 · 作息提示</title>
<style>
  :root{--blue:#2d6cdf;--ink:#1a1a2e;--red:#c0392b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#eef0ea;color:#222;padding:0 12px calc(20px + env(safe-area-inset-bottom)) 12px;}
  /* 固定的显眼窗口 */
  #nowBar{position:sticky;top:0;z-index:20;margin:0 -12px 12px;padding:14px 16px calc(14px + env(safe-area-inset-top));
          background:linear-gradient(135deg,#2d6cdf,#1a4fb0);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.22);}
  #nowBar .lbl{font-size:12px;opacity:.85;letter-spacing:2px;}
  #nowBar .act{font-size:24px;font-weight:800;line-height:1.25;margin:2px 0 6px;}
  #nowBar .cls{font-size:16px;font-weight:600;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;line-height:1.35;}
  #nowBar .cnt{font-size:15px;margin-top:7px;opacity:.96;}
  #nowBar .cnt b{font-size:20px;}
  #nowBar.soon{background:linear-gradient(135deg,#e67e22,#c0392b);}
  #nowBar.free{background:linear-gradient(135deg,#2d6cdf,#1a4fb0);}
  #nowBar.over{background:linear-gradient(135deg,#5f6b7a,#39424e);}

  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.10);padding:14px;margin-bottom:12px;}
  #clock{font-size:34px;font-weight:800;color:var(--ink);line-height:1;}
  #todayInfo{color:#666;font-size:14px;margin-top:4px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  button{border:0;border-radius:10px;padding:10px 14px;font-size:15px;background:#eceef1;color:#333;}
  h3{margin:4px 0 10px;font-size:16px;color:var(--ink);}
  .item{display:flex;gap:10px;padding:9px 0;border-top:1px solid #eee;align-items:flex-start;}
  .item:first-child{border-top:0;}
  .item .time{min-width:96px;font-variant-numeric:tabular-nums;color:#333;font-weight:600;font-size:13px;}
  .item .body{flex:1;}
  .item .name{font-size:15px;font-weight:600;}
  .item .meta{font-size:12px;color:#777;margin-top:2px;}
  .leave{color:var(--red);font-weight:700;}
  .past{opacity:.42;}
  .now{border-left:3px solid var(--blue);padding-left:8px;margin-left:-8px;}
  .tag{display:inline-block;font-size:11px;background:#eef3ff;color:#2d6cdf;border-radius:6px;padding:1px 6px;margin-left:6px;}
  .warn{color:var(--red);}
  #weekView table{width:100%;border-collapse:collapse;font-size:12px;}
  #weekView th,#weekView td{border:1px solid #e6e6e6;padding:4px 5px;text-align:left;vertical-align:top;}
  #weekView th{background:#f6f7f9;color:#555;}
</style>
</head>
<body>

  <!-- 固定的显眼窗口：现在该干什么 + 什么时候上课 -->
  <div id="nowBar" class="free">
    <div class="lbl">现在该做什么</div>
    <div class="act" id="nowAction">加载中…</div>
    <div class="cls" id="nowClass">--</div>
    <div class="cnt" id="nowCount"></div>
  </div>

  <div class="card">
    <div id="clock">--:--:--</div>
    <div id="todayInfo">加载中…</div>
    <div class="row" style="margin-top:10px;">
      <button id="refreshBtn">重算</button>
      <button id="mapBtn">🗺 地图</button>
    </div>
  </div>

  <div class="card">
    <h3 id="todayTitle">今日安排</h3>
    <div id="timeline"></div>
  </div>

  <div class="card" id="weekView">
    <h3>本周课表</h3>
    <div id="weekTable"></div>
  </div>

<script>window.SCHEDULE={"semester_start":"2026-09-14","semester_weeks":16,"note":"2026-2027 秋季学期。第1周周一 = 2026-09-14；第17-18周为考试周。","periods":{"1":["08:00","08:45"],"2":["08:55","09:40"],"3":["10:00","10:45"],"4":["10:55","11:40"],"5":["13:00","13:45"],"6":["13:55","14:40"],"7":["15:00","15:45"],"8":["15:55","16:40"],"9":["18:00","18:45"],"10":["18:55","19:40"],"11":["20:00","20:45"],"12":["20:55","21:40"]},"home":"南区11号楼","locations":{"南区11号楼":[121.384831,31.312046],"A楼":[121.390886,31.315309],"C楼":[121.39064,31.316291],"D楼":[121.390308,31.316709],"DJ楼":[121.391034,31.317034],"EJ楼":[121.390405,31.318109],"计算机楼":[121.395216,31.319135],"环化楼":[121.395367,31.321065],"体育馆":[121.390784,31.321418]},"courses":[{"day":1,"periods":[1,2],"name":"法语精读","room":"A302","building":"A楼","weeks":"1-16"},{"day":1,"periods":[3,4],"name":"高等数学","room":"DJ208","building":"DJ楼","weeks":"1-16"},{"day":1,"periods":[5,6],"name":"大学英语","room":"C607","building":"C楼","weeks":"1-16"},{"day":1,"periods":[7,8],"name":"工程化学","room":"EJ306","building":"EJ楼","weeks":"1-16"},{"day":2,"periods":[1,2],"name":"世界设计大观","room":"EJ306","building":"EJ楼","weeks":"1-8"},{"day":2,"periods":[3,4],"name":"法语精读","room":"A302","building":"A楼","weeks":"1-16"},{"day":2,"periods":[5,6],"name":"生成式人工智能","room":"计301","building":"计算机楼","weeks":"1-16"},{"day":2,"periods":[7,8],"name":"形势与政策","room":"EJ106","building":"EJ楼","weeks":"2,6,10,14"},{"day":3,"periods":[1,2],"name":"法语精读","room":"A302","building":"A楼","weeks":"1-16"},{"day":3,"periods":[3,4],"name":"高等数学","room":"DJ208","building":"DJ楼","weeks":"1-16"},{"day":3,"periods":[5,6],"name":"大学英语","room":"C607","building":"C楼","weeks":"1-16"},{"day":3,"periods":[7,8],"name":"应用法语","room":"D210","building":"D楼","weeks":"1-16"},{"day":3,"periods":[9,10],"name":"工程化学实验","room":"东区环化18号楼520","building":"环化楼","weeks":"1-16"},{"day":4,"periods":[3,4],"name":"法语精读","room":"A302","building":"A楼","weeks":"1-16"},{"day":4,"periods":[5,6],"name":"应用法语","room":"D210","building":"D楼","weeks":"9-16"},{"day":4,"periods":[7,8],"name":"体育基础课","room":"EJ403","building":"EJ楼","weeks":"1"},{"day":4,"periods":[7,8],"name":"体育基础课","room":"未排地点","building":"体育馆","weeks":"2-16","tentative":true},{"day":4,"periods":[9,11],"name":"中国近现代史纲要","room":"EJ203","building":"EJ楼","weeks":"1-16"},{"day":5,"periods":[1,2],"name":"法语精读","room":"A302","building":"A楼","weeks":"1-16"},{"day":5,"periods":[3,4],"name":"高等数学","room":"DJ208","building":"DJ楼","weeks":"1-16"}],"buffer":{"factor":2.0,"base_min":3.0,"note":"通勤时间 = 骑车时间 × factor + base_min（factor 为突发余量系数）"}};</script>
<script>
(function(){
  var SCH = window.SCHEDULE;
  var core = new SHURouter.RouterCore(window.GRAPH_DATA);
  var WEEKDAY_CN = ["","周一","周二","周三","周四","周五","周六","周日"];

  function hhmm(s){var p=s.split(":");return (+p[0])*60+(+p[1]);}
  function fmt(m){m=Math.round(m);return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2);}
  function parseWeeks(s){var out={};String(s).split(",").forEach(function(x){x=x.trim();if(!x)return;
    if(x.indexOf("-")>=0){var a=+x.split("-")[0],b=+x.split("-")[1];for(var i=a;i<=b;i++)out[i]=1;}else out[+x]=1;});return out;}
  function weekNumber(d){var s=new Date(SCH.semester_start+"T00:00:00");var diff=Math.floor((d-s)/86400000);return diff<0?0:Math.floor(diff/7)+1;}

  var bikeCache={};
  function bikeMin(a,b){
    if(a===b) return 0;
    var k=a+"|"+b; if(bikeCache[k]!==undefined) return bikeCache[k];
    var la=SCH.locations[a], lb=SCH.locations[b];
    if(!la||!lb){bikeCache[k]=0;return 0;}
    var r=core.route(la[0],la[1],lb[0],lb[1],"bike","time");
    var t=r?r.time/60:0; bikeCache[k]=t; return t;
  }
  var FACTOR = SCH.buffer.factor, BASE = SCH.buffer.base_min;
  function commute(a,b){ return bikeMin(a,b)*FACTOR + BASE; }

  function dayPlan(day, week){
    var cs=SCH.courses.filter(function(c){return c.day===day;});
    if(week!=null) cs=cs.filter(function(c){return parseWeeks(c.weeks)[week];});
    cs.sort(function(a,b){return a.periods[0]-b.periods[0];});
    var rows=[], prev=SCH.home, prevEnd=null;
    cs.forEach(function(c){
      var p0=c.periods[0], p1=c.periods[c.periods.length-1];
      var start=hhmm(SCH.periods[String(p0)][0]);
      var end=hhmm(SCH.periods[String(p1)][1]);
      var comm=commute(prev,c.building);
      rows.push({c:c,start:start,end:end,from:prev,to:c.building,
                 bike:bikeMin(prev,c.building),commute:comm,leave:start-comm,
                 gap:prevEnd==null?null:start-prevEnd});
      prev=c.building; prevEnd=end;
    });
    return rows;
  }

  function durText(mins){
    var mm=Math.floor(mins), ss=Math.round((mins-mm)*60);
    if(ss===60){mm++;ss=0;}
    if(mm<=0) return ss+" 秒";
    if(mm<60) return mm+" 分 "+ss+" 秒";
    return Math.floor(mm/60)+" 小时 "+(mm%60)+" 分";
  }

  function updateNowBar(rows, nowMin){
    var bar=document.getElementById("nowBar");
    var actEl=document.getElementById("nowAction");
    var clsEl=document.getElementById("nowClass");
    var cntEl=document.getElementById("nowCount");
    bar.className="free";

    if(!rows.length){
      actEl.textContent="今天没有课 🎉";
      clsEl.textContent="自由安排";
      cntEl.textContent="";
      bar.className="over";
      return;
    }

    // 当前正在上的课
    var cur=null, next=null;
    rows.forEach(function(r){
      if(nowMin>=r.start && nowMin<=r.end && !cur) cur=r;
      if(r.start>nowMin && !next) next=r;
    });

    if(cur){
      bar.className="soon";
      actEl.textContent="正在上课： "+cur.c.name;
      clsEl.textContent="本节 "+fmt(cur.start)+"–"+fmt(cur.end)+"  @ "+cur.to+" "+cur.c.room;
      if(next){
        var toLeave=next.leave-nowMin;
        cntEl.innerHTML="距下课 <b>"+durText(cur.end-nowMin)+"</b> ｜ 下一节 <b>"+fmt(next.start)+"</b> "
          +next.c.name+" @ "+next.to
          +(toLeave>0?(" ｜ 距出发 "+durText(toLeave)):(" ｜ <b>上完就要走</b>"));
      }else{
        cntEl.innerHTML="距下课 <b>"+durText(cur.end-nowMin)+"</b> ｜ 今天课程即将结束";
      }
      return;
    }

    if(next){
      var toStart=next.start-nowMin, toLeave=next.leave-nowMin;
      if(toLeave<=0){
        bar.className="soon";
        actEl.textContent="该出发了 → "+next.to;
        clsEl.textContent=fmt(next.start)+" 上课： "+next.c.name+"  @ "+next.to+" "+next.c.room;
        cntEl.innerHTML="骑车约 <b>"+next.bike.toFixed(0)+" 分钟</b> ｜ 距上课 <b>"+durText(toStart)+"</b>";
      }else{
        bar.className="free";
        actEl.textContent="现在：自由时间";
        clsEl.textContent="下一节 "+fmt(next.start)+" 上课： "+next.c.name+"  @ "+next.to+" "+next.c.room;
        cntEl.innerHTML="距上课 <b>"+durText(toStart)+"</b> ｜ "+fmt(next.leave)+" 出发（提前 "
          +next.commute.toFixed(0)+" 分钟，骑车 "+next.bike.toFixed(0)+" 分钟）";
      }
      return;
    }

    // 全部上完
    var last=rows[rows.length-1];
    var back=commute(last.to, SCH.home);
    bar.className="over";
    actEl.textContent="今天课程已结束 🏠";
    clsEl.textContent="返回宿舍： "+SCH.home;
    cntEl.innerHTML="骑车约 "+bikeMin(last.to,SCH.home).toFixed(0)+" 分钟（含余量 "+back.toFixed(0)+" 分钟）";
  }

  function render(){
    var now=new Date();
    var wk=weekNumber(now);
    var day=now.getDay();
    var nowMin=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
    document.getElementById("clock").textContent=
      ("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2)+":"+("0"+now.getSeconds()).slice(-2);
    document.getElementById("todayInfo").textContent=
      now.getFullYear()+"-"+("0"+(now.getMonth()+1)).slice(-2)+"-"+("0"+now.getDate()).slice(-2)
      +" "+WEEKDAY_CN[day]+" · 第 "+wk+" 周";
    document.getElementById("todayTitle").textContent="今日安排（"+WEEKDAY_CN[day]+"）";

    var rows=dayPlan(day,wk);

    var tl=document.getElementById("timeline");
    if(!rows.length){
      tl.innerHTML='<div class="meta">今天没有课 🎉</div>';
    }else{
      var html="";
      rows.forEach(function(r){
        var c=r.c, past=(nowMin>r.end);
        html+='<div class="item '+(past?"past":"")+(nowMin>=r.leave&&nowMin<=r.end?" now":"")+'">'
          +'<div class="time"><span class="leave">'+fmt(r.leave)+'</span> 出发<br>'+fmt(r.start)+'–'+fmt(r.end)+'</div>'
          +'<div class="body"><div class="name">'+c.name+'<span class="tag">'+c.building+' '+c.room+'</span></div>'
          +'<div class="meta">'+r.from+' → '+r.to+' · 骑车 '+r.bike.toFixed(1)+' 分，含余量 '+r.commute.toFixed(1)+' 分'
          +(c.tentative?' · <span class="warn">未排地点，暂按体育馆</span>':'')
          +((r.gap!=null&&r.gap<r.commute)?' · <span class="warn">与上节间隔不足</span>':'')
          +'</div></div></div>';
      });
      var last=rows[rows.length-1];
      html+='<div class="item"><div class="time">'+fmt(last.end)+' 后</div><div class="body">'
        +'<div class="name">返回宿舍 <span class="tag">'+SCH.home+'</span></div>'
        +'<div class="meta">骑车 '+bikeMin(last.to,SCH.home).toFixed(1)+' 分，含余量 '+commute(last.to,SCH.home).toFixed(1)+' 分</div></div></div>';
      tl.innerHTML=html;
    }

    updateNowBar(rows, nowMin);
    renderWeek(day, wk);
  }

  function renderWeek(day, wk){
    var days=[1,2,3,4,5];
    var h='<table><tr><th>节</th>'+days.map(function(d){return '<th>'+WEEKDAY_CN[d]+'</th>';}).join('')+'</tr>';
    for(var p=1;p<=12;p++){
      h+='<tr><td>'+p+'</td>';
      days.forEach(function(d){
        var cell="";
        SCH.courses.forEach(function(c){
          if(c.day===d && c.periods.indexOf(p)>=0){
            var active=parseWeeks(c.weeks)[wk];
            cell+='<div style="'+(active?'':'opacity:.35')+'">'+c.name+'<br><span style="color:#888">'+c.room+'</span></div>';
          }
        });
        h+='<td>'+cell+'</td>';
      });
      h+='</tr>';
    }
    h+='</table><div style="font-size:11px;color:#999;margin-top:6px;">灰显=本周不上（按周次）</div>';
    document.getElementById("weekTable").innerHTML=h;
  }

  document.getElementById("refreshBtn").onclick=function(){ bikeCache={}; render(); };
  document.getElementById("mapBtn").onclick=function(){ location.href="index.html"; };

  render();
  setInterval(render, 1000);
})();
</script>
